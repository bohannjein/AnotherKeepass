[package]
name = "anotherkeepass"
version = "0.1.0"
description = "KeePass-compatible password manager"
authors = ["AnotherKeepass"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "anotherkeepass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
keepass = { version = "0.17", features = ["save_kdbx4", "totp", "_merge"] }
rust-argon2 = "3"
chrono = "0.4"
uuid = "1"
base64 = "0.22"
arboard = "3"
tauri-plugin-dialog = "2"
zeroize = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
enigo = "0.6"
crypto_box = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["net", "io-util", "io-std", "sync", "time", "rt", "macros", "process", "rt-multi-thread"] }
url = "2"
sha1 = "0.10"
ureq = { version = "2", features = ["json"] }
ssh-key = { version = "0.6", features = ["encryption", "ed25519", "rsa", "ecdsa", "p256", "p384"] }
ssh-encoding = { version = "0.2", features = ["alloc"] }
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }
rsa = { version = "0.9", features = ["sha2"] }
rand_core = { version = "0.6", features = ["getrandom"] }
aes = "0.8"
hmac = "0.12"
hkdf = "0.12"
pbkdf2 = "0.12"
cbc = "0.1"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_Foundation", "Foundation"] }
windows-future = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_RemoteDesktop", "Win32_System_LibraryLoader"] }
winreg = "0.55"
