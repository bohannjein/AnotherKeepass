[advisories]
# Timing side channels without a fixed version in our dependency line yet. Both only matter if
# an attacker can time many operations; we sign/decrypt locally on user action, not as a server.
# RUSTSEC-2023-0071: rsa (Vaultwarden organisation keys)
# RUSTSEC-2026-0387: crypto-bigint 0.5 via p256 0.13 / ssh-key 0.6 (passkeys, SSH agent);
#                    fixed in crypto-bigint 0.7, which needs p256 0.14 and ssh-key 0.7
ignore = ["RUSTSEC-2023-0071", "RUSTSEC-2026-0387"]
