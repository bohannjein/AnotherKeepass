name: release

# A tag "v1.2.3" (or "v1.2.3-beta.1" for a prerelease) builds Windows and Linux, signs the update
# packages and creates a DRAFT release with latest.json for the in-app updater. Publish the draft
# on GitHub after checking it; only published releases reach the updater.
# Secrets: TAURI_SIGNING_PRIVATE_KEY (+ _PASSWORD, may be empty) = the update key.

on:
  push:
    tags: ['v*']
  workflow_dispatch: # build only, artifacts attached to the run (no release)

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc → AppImage runs on most distros
            bundles: appimage,deb,rpm
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # fail early with a readable annotation instead of after a full build
      - name: Check update signing key
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is empty or not visible here. It must be a Repository secret (Settings > Secrets and variables > Actions > Repository secrets)."
            exit 1
          fi
          set -o pipefail
          if ! printf '%s' "$KEY" | base64 -d 2>/dev/null | grep -q "untrusted comment"; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY is not a complete key (${#KEY} characters). Paste the whole content of the .key file, including the '==' at the end."
            exit 1
          fi
          echo "::notice::update key present (${#KEY} characters)"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: AnotherKeepass ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed.
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.conf.json

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: anotherkeepass-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm

      # Microsoft Store: the same exe as MSIX (unsigned, the Store signs it). Identity values from
      # Partner Center as repository variables MSIX_IDENTITY_NAME, MSIX_PUBLISHER, MSIX_PUBLISHER_NAME.
      - name: MSIX for the Microsoft Store
        if: runner.os == 'Windows'
        shell: bash
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/build-msix.mjs
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release upload "$GITHUB_REF_NAME" src-tauri/target/AnotherKeepass_*_x64.msix --clobber -R "$GITHUB_REPOSITORY"
          fi

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && !startsWith(github.ref, 'refs/tags/')
        with:
          name: anotherkeepass-msix
          path: src-tauri/target/AnotherKeepass_*_x64.msix

      # the Flatpak is built from the .deb
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: deb-for-flatpak
          path: src-tauri/target/release/bundle/deb/*.deb

  flatpak:
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-47
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: deb-for-flatpak
          path: flatpak/deb
      - name: Name the .deb for the manifest
        run: mv flatpak/deb/*.deb flatpak/anotherkeepass.deb
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: AnotherKeepass.flatpak
          manifest-path: flatpak/app.anotherkeepass.desktop.yml
          cache-key: flatpak-${{ github.sha }}

  # the release is a draft created by tauri-action; attach the Flatpak bundle to it
  flatpak-release:
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AnotherKeepass*
          merge-multiple: true
      - name: Upload to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f=$(ls *.flatpak | head -1)
          mv "$f" "AnotherKeepass_${GITHUB_REF_NAME#v}_x86_64.flatpak"
          gh release upload "$GITHUB_REF_NAME" AnotherKeepass_*.flatpak --clobber -R "$GITHUB_REPOSITORY"
      # SHA-256 of every download, linked from the website
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir sums && cd sums
          gh release download "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" -p '*.exe' -p '*.deb' -p '*.rpm' -p '*.AppImage' -p '*.flatpak' -p '*.msix'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --clobber -R "$GITHUB_REPOSITORY"
